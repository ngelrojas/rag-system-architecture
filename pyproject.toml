[project]
name = "rag-system-architecture"
version = "0.0.0"
description = "Companion code for the book RAG Systems Architecture — one branch per chapter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "qdrant-client>=1.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "import-linter>=2.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^\\.venv/"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
